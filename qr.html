<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>QR — Za tebe</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 20px;
      background: linear-gradient(180deg, #ffeaf3, #ff9ec8);
      font-family: "Press Start 2P", monospace;
    }
    img {
      width: min(420px, 92vw);
      height: auto;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(138, 13, 63, 0.25);
    }
    a {
      color: #fff;
      text-decoration: none;
      background: linear-gradient(180deg, #ff6ba8, #e91e6f);
      border: 3px solid #fff;
      outline: 2px solid #ff3d8a;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 9px;
      box-shadow: 0 4px 0 #8a0d3f;
    }
  </style>
</head>
<body>
  <img src="qr-date.png" alt="Romantičan QR kod za date sajt" width="900" height="1100" />
  <a href="qr-date.png" download="qr-date.png">Preuzmi QR</a>
</body>
</html>
